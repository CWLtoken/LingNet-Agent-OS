# LingNet Agent OS V2.5 — LLM Provider Configuration
# P0-3: Real API configuration via TOML
# Copy to ~/.config/lingnet/providers.toml and set your API keys

[providers.openai]
name = "OpenAI"
endpoint = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"  # Read from env var
api_compat = "openai"
weight = 10
latency_ms = 0.0
error_rate = 0.0

[[providers.openai.models]]
id = "gpt-4o"
name = "GPT-4o"
cost_in = 2.5      # $/1M input tokens
cost_out = 10.0     # $/1M output tokens
max_tokens = 128000

[[providers.openai.models]]
id = "gpt-4o-mini"
name = "GPT-4o Mini"
cost_in = 0.15
cost_out = 0.60
max_tokens = 128000

[providers.anthropic]
name = "Anthropic"
endpoint = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
api_compat = "anthropic"
weight = 8
latency_ms = 0.0
error_rate = 0.0

[[providers.anthropic.models]]
id = "claude-3-5-sonnet-20241022"
name = "Claude 3.5 Sonnet"
cost_in = 3.0
cost_out = 15.0
max_tokens = 200000

[[providers.anthropic.models]]
id = "claude-3-haiku-20240307"
name = "Claude 3 Haiku"
cost_in = 0.25
cost_out = 1.25
max_tokens = 200000

[routing]
strategy = "smart"       # race | smart | uniform
fallback_strategy = "uniform"
budget_per_hour = 10.0   # USD
retry_count = 2
retry_delay_ms = 1000
race_timeout_ms = 5000

[routing.candidates]
# Format: "provider/model"
primary = ["openai/gpt-4o", "anthropic/claude-3-5-sonnet-20241022"]
fallback = ["openai/gpt-4o-mini", "anthropic/claude-3-haiku-20240307"]
